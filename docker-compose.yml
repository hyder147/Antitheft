services:
  postgres:
    image: postgres:16-alpine
    container_name: antitheftapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: antitheftapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Haider@12345
    ports:
      - "5432:5432"
    volumes:
      - antitheftapp_pgdata:/var/lib/postgresql/data

volumes:
  antitheftapp_pgdata:
